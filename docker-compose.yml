# Backend port (inside the container and published on the host). Override with
# e.g. `BACKEND_PORT=9090 docker compose up --build -d` (or set it in a .env file).

services:
  backend:
    build:
      context: ./mock-api-backend
    image: mock-api:latest
    environment:
      # Port Spring Boot listens on (maps to server.port).
      SERVER_PORT: ${BACKEND_PORT:-8090}
      # Where the service persists YAML configurations (backed by a named volume).
      FILES_UPLOAD_FOLDER: /data/configurations/
      # Use the forwarded frontend origin in Codespaces; defaults to localhost.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081}
    volumes:
      - mock_api_data:/data/configurations
    # Published so the frontend can reach it through Docker's host gateway.
    ports:
      - "${BACKEND_PORT:-8090}:${BACKEND_PORT:-8090}"
    restart: unless-stopped

  frontend:
    build:
      context: ./mock-api-frontend
      args:
        # Backend URL shown to users (e.g. "Copy curl"), as reachable from the host.
        VITE_BACKEND_URL: http://localhost:${BACKEND_PORT:-8090}
    image: mock-api-ui:latest
    environment:
      # Codespaces may isolate bridge peers; route nginx via the published port.
      BACKEND_UPSTREAM: http://host.docker.internal:${BACKEND_PORT:-8090}
    depends_on:
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8081:80"
    restart: unless-stopped

volumes:
  mock_api_data:
